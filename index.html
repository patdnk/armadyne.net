<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>ARMADYNE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* Animated gradient background */
      background: linear-gradient(-45deg, #000, #333, #1a1a1a, #2d2d2d);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .svg-container {
      width: 100%;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeInUp 2s ease-out, float 6s ease-in-out infinite;
      animation-delay: 0s, 2s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    svg {
      width: 80%;
      height: 80%;
      filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.3));
      transition: filter 0.3s ease;
    }

    svg:hover {
      filter: drop-shadow(0 0 15px rgba(255, 51, 51, 0.6));
    }

    /* SVG path animations */
    .cls-1, .cls-2 {
      stroke-width: 2;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawPath 3s ease-in-out forwards;
      transition: stroke 0.3s ease, fill 0.3s ease;
    }

    /* Logo part - custom red */
    .cls-2 {
      fill: #D81E1E;
      stroke: #A61717;
    }

    /* Text part - white with grey outline */
    .cls-1 {
      fill: #FFF;
      stroke: #999;
      stroke-width: 1;
    }

    .cls-1 {
      animation-delay: 0.5s;
    }

    .cls-2 {
      animation-delay: 1s;
    }

    @keyframes drawPath {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Hover effects */
    .svg-container:hover .cls-2 {
      stroke: #A61717;
      fill: #D81E1E;
      stroke-width: 3;
    }

    .svg-container:hover .cls-1 {
      stroke: #999;
      fill: #FFF;
      stroke-width: 2;
    }

    /* Add some sparkle effects */
    .svg-container::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      right: -50px;
      bottom: -50px;
      background: radial-gradient(circle, transparent 1px, rgba(102, 102, 102, 0.1) 1px);
      background-size: 20px 20px;
      animation: sparkle 4s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(10px) translateY(-5px); }
      50% { transform: translateX(-5px) translateY(10px); }
      75% { transform: translateX(-10px) translateY(-5px); }
      100% { transform: translateX(0) translateY(0); }
    }

    /* Text styling for any text elements */
    text {
      fill: #999;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
